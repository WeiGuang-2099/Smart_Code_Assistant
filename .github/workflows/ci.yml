name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip jobs whose area did not change (docs-only pushes run nothing below).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      evals: ${{ steps.filter.outputs.evals }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-fastapi/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            evals:
              - 'evals/**'
              - 'backend-fastapi/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend-fastapi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Run tests with coverage
        env:
          FASTAPI_ENV: testing
          DATABASE_URL: mysql+aiomysql://ci:ci@localhost:3306/ci_test
          SECRET_KEY: ci-secret-key-for-tests-only
          ZHIPUAI_API_KEY: ci-test-key
          DATALAB_API_KEY: ci-test-key
          NEO4J_PASSWORD: ci-test-password
        run: |
          pytest tests/ \
            --cov \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=55 \
            --timeout=60 \
            --timeout-method=thread \
            -x

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend-fastapi/htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: backend-fastapi/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Audit installed dependencies (advisory)
        # Audits the resolved CI environment. Non-blocking until existing
        # advisories are triaged; then drop continue-on-error to enforce.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend - typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Audit dependencies (advisory)
        # Non-blocking until existing advisories are triaged; then drop
        # continue-on-error to enforce.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        # Fails on errors; warnings are tolerated (the rules-of-hooks family
        # is enforced as errors via eslint.config.js, the rest are warnings
        # that document legacy patterns we plan to refactor).
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Run unit tests
        run: npm test -- --reporter=default --test-timeout=30000

      - name: Build
        run: npm run build

  evals-smoke:
    name: Evals - retrieval smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chromadb:
        # Pinned to match the chromadb client in requirements.txt; the 1.x
        # image ships no curl/wget and removed the v1 API, so probe the port
        # with bash's /dev/tcp instead of an HTTP client.
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/8000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt
      - name: Cache HuggingFace bge model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-zh-v1.5-${{ runner.os }}
      - name: Install backend deps
        working-directory: backend-fastapi
        run: pip install -r requirements.txt
      - name: Eval unit tests
        run: pytest evals/tests/ -v
      - name: Run smoke eval (gated)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8001"
          ZHIPUAI_API_KEY: ci-test-key
          SECRET_KEY: ci-secret-key-for-tests-only
        # --gate fails the job (exit 1) if any metric in thresholds.smoke.json
        # drops below its floor - retrieval regressions cannot merge silently.
        run: |
          python -m evals.run \
            --golden evals/golden_set/mini_fixture.jsonl \
            --index-corpus evals/fixtures/mini_repo \
            --gate evals/thresholds.smoke.json
      - name: Upload evals results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: evals/results/*.json
          retention-days: 30
